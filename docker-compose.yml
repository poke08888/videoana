services:
  videoana:
    build: .
    container_name: videoana-app
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8787
      # DB nằm trong volume bền vững (không mất khi rebuild container).
      - DB_PATH=/app/data/db.sqlite
      # ffmpeg hệ thống (cài trong image) để trích frame ổn định trên alpine.
      - FFMPEG_PATH=/usr/bin/ffmpeg
      # Xưởng: file ảnh/clip/mp4 nằm trên ổ dữ liệu 150GB (/data), KHÔNG trên ổ hệ thống
      - STUDIO_DATA_DIR=/app/data/studio
      - STUDIO_SUB_FONT=DejaVu Sans
      # Style kênh: video tải tạm nằm trên ổ /data (150GB), xoá ngay sau khi phân tích
      - STYLE_TMP_DIR=/app/data/style-tmp
    volumes:
      - ./data:/app/data
      - /data/videoana-studio:/app/data/studio
      - /data/videoana-style-tmp:/app/data/style-tmp
    restart: unless-stopped
